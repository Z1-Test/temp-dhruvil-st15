name: "Dependabot Issue Linker"

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  link-dependabot-issue:
    name: "Create & Link Tracking Issue"
    # Execute ONLY for Dependabot PRs
    if: github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: shr
    steps:
      - name: Create Issue and Link to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed("No pull_request payload found.");
              return;
            }

            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const currentBody = pr.body || '';

            // 1. Idempotency: Skip if an issue link already exists
            if (/(Closes|Fixes|Resolves)\s+#[0-9]+/i.test(currentBody)) {
              core.info(`PR #${pr.number} already contains an issue link. Skipping creation.`);
              return;
            }

            // 2. Ensure PR has no labels (clear any default or added labels)
            try {
              await github.rest.issues.setLabels({
                ...repo,
                issue_number: pr.number,
                labels: [],
              });
              core.info(`Ensured no labels on PR #${pr.number}`);
            } catch (labelErr) {
              core.warning(`Label clearance warning: ${labelErr.message}`);
            }

            // 3. Construct issue title (truncate to <= 49 chars to satisfy org rules)
            let issueTitle = `[Dependabot] ${pr.title}`;
            if (issueTitle.length > 49) {
              issueTitle = issueTitle.slice(0, 46) + '...';
            }

            const issueBody = `### Objective
            Automated update tracking for Dependabot pull request #${pr.number}.

            ### Context
            - **Pull Request**: #${pr.number} (${pr.html_url})
            - **Triggered By**: Dependabot Version Bump
            - **Status**: Pending Review & Automated Checks

            ### Acceptance Criteria
            - [x] Automated Dependabot dependency update pull request opened
            - [x] CI check suite verification initiated
            - [x] Downstream review and compatibility validation`.replace(/^ {12}/gm, '');

            // 4. Create the tracking issue
            core.info('Creating tracking issue...');
            const newIssue = await github.rest.issues.create({
              ...repo,
              title: issueTitle,
              body: issueBody,
            });
            const issueNumber = newIssue.data.number;
            const issueNodeId = newIssue.data.node_id;
            core.info(`Successfully created Issue #${issueNumber} (${newIssue.data.html_url})`);

            // 5. Set Issue Type to Upgrade
            try {
              let issueTypeId = 'IT_kwDOBlYEys4BvLVd';
              try {
                const repoData = await github.graphql(`
                  query($owner: String!, $repo: String!) {
                    repository(owner: $owner, name: $repo) {
                      issueTypes(first: 25) {
                        nodes {
                          id
                          name
                        }
                      }
                    }
                  }
                `, { owner: repo.owner, repo: repo.repo });
                const upgradeType = repoData.repository?.issueTypes?.nodes?.find(t => /upgrade/i.test(t.name));
                if (upgradeType) {
                  issueTypeId = upgradeType.id;
                }
              } catch (queryErr) {
                core.info(`Using fallback Upgrade issueTypeId: ${queryErr.message}`);
              }

              await github.graphql(`
                mutation($id: ID!, $issueTypeId: ID!) {
                  updateIssue(input: { id: $id, issueTypeId: $issueTypeId }) {
                    issue {
                      id
                      issueType {
                        name
                      }
                    }
                  }
                }
              `, { id: issueNodeId, issueTypeId });
              core.info(`Successfully set issue type to Upgrade on Issue #${issueNumber}`);
            } catch (typeErr) {
              core.warning(`Issue type setting warning: ${typeErr.message}`);
            }

            // 6. Set Priority P1 (field_id: 3129)
            try {
              await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/issue-field-values', {
                ...repo,
                issue_number: issueNumber,
                issue_field_values: [{ field_id: 3129, value: 'P1' }],
                headers: {
                  accept: 'application/vnd.github+json',
                },
              });
              core.info(`Successfully set Priority P1 on Issue #${issueNumber}`);
            } catch (fieldErr) {
              core.warning(`Priority field setting warning: ${fieldErr.message}`);
            }

            // 7. Update PR description with 'Closes #<issue>'
            const updatedBody = currentBody
              ? `${currentBody}\n\n---\n### Tracking Issue\nCloses #${issueNumber}\n`
              : `---\n### Tracking Issue\nCloses #${issueNumber}\n`;

            core.info(`Updating PR #${pr.number} with issue link...`);
            await github.rest.pulls.update({
              ...repo,
              pull_number: pr.number,
              body: updatedBody,
            });

            core.info(`Done: Linked Issue #${issueNumber} to PR #${pr.number}.`);

